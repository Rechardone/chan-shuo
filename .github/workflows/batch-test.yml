name: Batch Test

on:
  push:
    branches:
      - codex/batch-01-bootstrap
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  batch-test:
    name: Batch Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run batch tests
        shell: bash
        env:
          NG_CLI_ANALYTICS: 'false'
          CHAN_SHUO_ROOT: ${{ github.workspace }}
          LLM_PROVIDER: mock
        run: |
          set -o pipefail
          mkdir -p reports
          pnpm test:batches 2>&1 | tee reports/github-actions-latest.log

      - name: Upload batch reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chan-shuo-batch-reports
          path: |
            reports/*.md
            reports/*.log
          if-no-files-found: warn
          retention-days: 14
